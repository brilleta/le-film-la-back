spring.application.name=le-film-la-back
spring.config.import=optional:file:.env[.properties]
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health

tmdb.base-url=https://api.themoviedb.org/3
tmdb.token=${TMDB_TOKEN}
tmdb.language=fr-FR
tmdb.connect-timeout=3s
tmdb.read-timeout=5s

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.model=${ANTHROPIC_MODEL:claude-haiku-5-5}
spring.ai.anthropic.chat.max-tokens=2000
spring.ai.anthropic.timeout=30s
spring.ai.anthropic.max-retries=1

# Ne fait confiance à X-Forwarded-For que depuis un proxy interne (nginx, Coolify)
server.forward-headers-strategy=native

rate-limit.ai.capacity=10
rate-limit.ai.period=1m
rate-limit.auth.capacity=10
rate-limit.auth.period=1m

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Le schéma est géré uniquement par Flyway : Hibernate se contente de le vérifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

auth.jwt.secret=${JWT_SECRET}
auth.jwt.ttl=${JWT_TTL:PT24H}
auth.cookie.name=auth_token
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}

# Premier admin : promu au démarrage s'il a un compte et qu'aucun admin n'existe encore
admin.email=${ADMIN_EMAIL:}

# Render injecte PORT ; 8080 par défaut pour docker-compose et le dev local
server.port=${PORT:8080}

# Pool dimensionné pour Neon (free) : les connexions inactives sont fermées pour laisser le compute se suspendre
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000

# Kafka : KRaft local via docker compose (port 9094 exposé sur l'hôte), Aiven en prod
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.client-id=le-film-la-back
spring.kafka.consumer.group-id=le-film-la-back
spring.kafka.consumer.auto-offset-reset=earliest
# Producteur idempotent + acks=all : pas de doublon ni de perte côté broker
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Un broker absent ne doit pas empêcher le démarrage (le back reste utilisable sans Kafka)
spring.kafka.admin.fail-fast=false
kafka.topics.partitions=${KAFKA_TOPIC_PARTITIONS:3}
kafka.topics.replication-factor=${KAFKA_TOPIC_REPLICATION_FACTOR:1}
