spring.application.name=le-film-la-back
spring.config.import=optional:file:.env[.properties]
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health

tmdb.base-url=https://api.themoviedb.org/3
tmdb.token=${TMDB_TOKEN}
tmdb.language=fr-FR
tmdb.connect-timeout=3s
tmdb.read-timeout=5s

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.model=${ANTHROPIC_MODEL:claude-haiku-5-5}
spring.ai.anthropic.chat.max-tokens=2000
spring.ai.anthropic.timeout=30s
spring.ai.anthropic.max-retries=1

# Ne fait confiance à X-Forwarded-For que depuis un proxy interne (nginx, Coolify)
server.forward-headers-strategy=native

rate-limit.ai.capacity=10
rate-limit.ai.period=1m
