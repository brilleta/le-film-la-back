# Profil prod (Render) : Kafka géré Aiven, authentification SASL/SCRAM sur TLS.
# Activé par SPRING_PROFILES_ACTIVE=prod ; en local, le profil par défaut reste en PLAINTEXT.

spring.kafka.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";

# Aiven signe ses brokers avec sa propre autorité : le certificat CA (PEM, contenu inline) est fourni par variable d'env
spring.ssl.bundle.pem.kafka.truststore.certificate=${KAFKA_CA_CERT}
spring.kafka.ssl.bundle=kafka

# Les topics créés au démarrage suivent le nombre de brokers du plan Aiven (voir KAFKA_TOPIC_REPLICATION_FACTOR)
